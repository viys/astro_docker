version: "3.9"

services:
  astro:
    build: .
    container_name: astro-dev
    working_dir: /app
    volumes:
      - .:/app                        # 热重载
      - node_modules:/app/node_modules # 缓存依赖
    ports:
      - "4321:4321"
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      NODE_ENV: development
    command: npx astro dev --host 0.0.0.0 --port 4321

volumes:
  node_modules:
